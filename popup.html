<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meet Transcript</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>Meet Transcript</h1></header>
  <main>
    <p id="status" role="status">Checking meeting tab…</p>
    <label for="mode">Transcription source</label>
    <select id="mode"><option value="audio">Tab audio</option><option value="captions">Live captions</option></select>
    <p class="hint" id="mode-hint">Transcribe tab audio with local Whisper.</p>
    <p class="reminder">Please let everyone know before you start transcribing.</p>
    <div class="controls"><button id="start" disabled>Start transcript</button><button id="stop" disabled>Stop</button></div>
    <p class="export-row"><button id="live" disabled>Export current tab transcript</button></p>
    <h2>Saved transcripts</h2>
    <p class="hint">Stored on this device.</p>
    <div id="sessions"></div>
    <p id="error" role="alert"></p>
  </main>
  <script src="audio-tools.js"></script><script src="captions.js"></script><script src="popup.js"></script>
</body></html>
