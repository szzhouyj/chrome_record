[project]
name = "meet-transcript"
version = "0.3.0"
description = "Local Whisper service for the Meet Transcript Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1.0,<2",
    "numpy>=1.26,<3",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["playwright>=1.49,<2", "scipy>=1.10,<2"]

[tool.uv]
package = false
default-groups = []
